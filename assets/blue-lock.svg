<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" height="100%">
  <defs>
    <!-- Screentone / Hatching Patterns -->
    <pattern id="lock-dots" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#ffffff" opacity="0.25"/>
    </pattern>
    <pattern id="shard-hatch" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="6" y2="6" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
    </pattern>
    <linearGradient id="impact-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="250" fill="#0d1117"/>

  <!-- Manga Frame -->
  <rect x="8" y="8" width="944" height="234" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <rect x="12" y="12" width="936" height="226" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>

  <!-- SECTION 03 / RUNNER-UP CALLOUT -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="14" height="14" fill="#ffffff"/>
    <text x="22" y="11" font-family="'Courier New', monospace" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="2">03 // COMPETITIVE ACCELERATION // BLUE LOCK</text>
    <text x="390" y="11" font-family="'Courier New', monospace" font-size="9" fill="#8b949e" letter-spacing="1.5">REVA HACKATHON RUNNER-UP · VELOCITY &amp; EXECUTION</text>
  </g>

  <!-- EXPLOSIVE RADIAL VELOCITY LINES (Converging on Impact Center) -->
  <g stroke="#ffffff" opacity="0.4" stroke-linecap="round">
    <!-- Focal point at (320, 135) -->
    <line x1="16" y1="20" x2="250" y2="115" stroke-width="2.5"/>
    <line x1="40" y1="60" x2="260" y2="120" stroke-width="1.2"/>
    <line x1="20" y1="120" x2="240" y2="130" stroke-width="2"/>
    <line x1="25" y1="180" x2="255" y2="145" stroke-width="1.5"/>
    <line x1="50" y1="225" x2="270" y2="155" stroke-width="2.8"/>
    <line x1="120" y1="235" x2="290" y2="165" stroke-width="1.2"/>

    <line x1="180" y1="16" x2="295" y2="100" stroke-width="2"/>
    <line x1="260" y1="14" x2="310" y2="95" stroke-width="1.8"/>
    <line x1="340" y1="14" x2="330" y2="92" stroke-width="2.2"/>
    <line x1="420" y1="16" x2="350" y2="105" stroke-width="1.5"/>
    <line x1="500" y1="30" x2="375" y2="115" stroke-width="2.4"/>

    <line x1="550" y1="90" x2="395" y2="130" stroke-width="1.8"/>
    <line x1="570" y1="145" x2="400" y2="140" stroke-width="2.5"/>
    <line x1="540" y1="200" x2="385" y2="155" stroke-width="2"/>
    <line x1="460" y1="235" x2="360" y2="165" stroke-width="1.5"/>
    <line x1="380" y1="235" x2="340" y2="175" stroke-width="2.6"/>
    <line x1="300" y1="235" x2="315" y2="175" stroke-width="1.2"/>
  </g>

  <!-- Heavy Manga Sound Effect Speed Streaks -->
  <g stroke="#ffffff" opacity="0.15">
    <line x1="14" y1="80" x2="200" y2="120" stroke-width="6"/>
    <line x1="480" y1="70" x2="380" y2="120" stroke-width="7"/>
    <line x1="100" y1="210" x2="260" y2="160" stroke-width="5"/>
    <line x1="490" y1="180" x2="380" y2="150" stroke-width="6"/>
  </g>

  <!-- SHATTERED GLASS POLYGON SHARDS (Flying Outward from the Core) -->
  <!-- Shard 1 (Top Left) -->
  <polygon points="210,50 250,30 270,70 230,85" fill="#161b22" stroke="#ffffff" stroke-width="1.8"/>
  <polygon points="215,52 245,35 260,65" fill="#ffffff" opacity="0.3"/>
  <polygon points="215,52 250,75 228,82" fill="url(#shard-hatch)"/>

  <!-- Shard 2 (Bottom Left) -->
  <polygon points="180,150 240,140 220,195 165,185" fill="#05070a" stroke="#ffffff" stroke-width="2"/>
  <polygon points="185,155 230,148 210,190" fill="url(#lock-dots)"/>
  
  <!-- Shard 3 (Top Right Sharp Spike) -->
  <polygon points="360,40 430,25 395,85" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
  <polygon points="370,45 415,35 390,75" fill="#0d1117"/>

  <!-- Shard 4 (Far Right Fragment) -->
  <polygon points="420,110 475,95 460,150 405,135" fill="#161b22" stroke="#ffffff" stroke-width="1.8"/>
  <polygon points="425,115 465,102 452,142" fill="url(#shard-hatch)"/>

  <!-- Shard 5 (Bottom Right Floating) -->
  <polygon points="340,190 395,175 420,225 365,228" fill="#05070a" stroke="#ffffff" stroke-width="2"/>
  <polygon points="350,195 390,182 405,218" fill="#ffffff" opacity="0.25"/>

  <!-- Small floating fragments / crystalline slivers -->
  <polygon points="280,35 295,28 290,42" fill="#ffffff"/>
  <polygon points="170,105 185,100 178,115" fill="#ffffff"/>
  <polygon points="410,75 425,68 418,82" fill="#ffffff"/>
  <polygon points="440,170 455,162 448,178" fill="#ffffff"/>
  <polygon points="260,200 275,195 268,208" fill="#ffffff"/>

  <!-- BLUE LOCK PUZZLE PIECE / CHEMICAL REACTION CORE -->
  <g transform="translate(320, 135)">
    <!-- Central Aura Ring -->
    <circle cx="0" cy="0" r="38" fill="#05070a" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
    <!-- Blue Lock / Egoist stylized Pentagonal Core -->
    <polygon points="0,-28 27,-9 17,23 -17,23 -27,-9" fill="#ffffff"/>
    <polygon points="0,-20 20,-6 12,17 -12,17 -20,-6" fill="#0d1117"/>
    <!-- Chemical Reaction / Lightning Spark Lines -->
    <path d="M -8,-6 L 4,-16 L 0,-4 L 10,-4 L -4,14 L 0,2 Z" fill="#ffffff"/>
  </g>

  <!-- RIGHT SIDE: REVA HACKATHON RUNNER-UP TROPHY & ACHIEVEMENT DOSSIER -->
  <g transform="translate(580, 48)">
    <!-- Outer Card -->
    <rect x="0" y="0" width="350" height="168" fill="#05070a" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Top Black/White Title Stripe -->
    <rect x="0" y="0" width="350" height="30" fill="#ffffff"/>
    <text x="14" y="20" font-family="'Courier New', monospace" font-size="12" font-weight="900" fill="#0d1117" letter-spacing="1.5">REVA HACKATHON // RUNNER-UP</text>

    <!-- Trophy / Podium Icon Box -->
    <g transform="translate(18, 44)">
      <!-- Podium base -->
      <polygon points="5,42 45,42 42,65 8,65" fill="#161b22" stroke="#ffffff" stroke-width="1.2"/>
      <rect x="18" y="22" width="14" height="20" fill="#ffffff"/>
      <!-- Cup -->
      <path d="M 12,5 L 38,5 L 34,22 L 16,22 Z" fill="#ffffff"/>
      <path d="M 8,8 C 5,12 8,18 14,18 M 42,8 C 45,12 42,18 36,18" stroke="#ffffff" stroke-width="1.8" fill="none"/>
      <!-- Screentone on trophy base -->
      <rect x="10" y="45" width="30" height="16" fill="url(#lock-dots)"/>
    </g>

    <!-- Hackathon Details Text -->
    <g transform="translate(80, 50)" font-family="'Courier New', monospace">
      <text x="0" y="10" font-size="9.5" font-weight="bold" fill="#ffffff">REVA UNIVERSITY · BENGALURU</text>
      <text x="0" y="24" font-size="8.5" fill="#8b949e">Division: Rapid Product Engineering</text>
      <text x="0" y="37" font-size="8.5" fill="#8b949e">Execution: Real-time Telemetry &amp; ML</text>
      <text x="0" y="52" font-size="8.5" fill="#ffffff">AWARD: 2ND PLACE / RUNNER-UP</text>
      <text x="0" y="65" font-size="8" fill="#8b949e">48-Hour Sprint · Zero Compromise</text>
    </g>

    <!-- Bottom Metric / Speed Bar -->
    <g transform="translate(18, 142)">
      <text x="0" y="-4" font-family="'Courier New', monospace" font-size="7.5" fill="#8b949e">VELOCITY_METRIC: SPRINT_COMPLETED</text>
      <rect x="0" y="0" width="314" height="8" fill="#0d1117" stroke="#ffffff" stroke-width="0.8"/>
      <rect x="2" y="2" width="280" height="4" fill="#ffffff"/>
    </g>
  </g>
</svg>
