<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="100%">
  <defs>
    <!-- Screentone / Hatching -->
    <pattern id="rain-screentone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#ffffff" opacity="0.2"/>
    </pattern>
    <pattern id="desk-hatch" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="6" x2="6" y2="0" stroke="#ffffff" stroke-width="0.75" opacity="0.15"/>
    </pattern>
    <linearGradient id="lamp-cone" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="window-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="240" fill="#0d1117"/>

  <!-- Manga Panel Outer Frame -->
  <rect x="8" y="8" width="944" height="224" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <rect x="12" y="12" width="936" height="216" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>

  <!-- SECTION 01 / TITLE CALLOUT -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="14" height="14" fill="#ffffff"/>
    <text x="22" y="11" font-family="'Courier New', monospace" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="2">01 // QUIET STUDY // 雨の夜</text>
    <text x="240" y="11" font-family="'Courier New', monospace" font-size="9" fill="#8b949e" letter-spacing="1.5">EIE UNDERGRADUATE · BANGALORE INSTITUTE OF TECHNOLOGY</text>
  </g>

  <!-- Window Frame in Background (Rain Streaks Outside) -->
  <g transform="translate(480, 24)">
    <!-- Outside dark background -->
    <rect x="0" y="0" width="440" height="135" fill="url(#window-fade)"/>
    <rect x="0" y="0" width="440" height="135" fill="url(#rain-screentone)"/>

    <!-- Window Panes (Mullions) -->
    <rect x="0" y="0" width="440" height="135" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <line x1="146" y1="0" x2="146" y2="135" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <line x1="292" y1="0" x2="292" y2="135" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="68" x2="440" y2="68" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>

    <!-- Rain Streaks On Glass -->
    <g stroke="#ffffff" stroke-linecap="round" opacity="0.35">
      <line x1="25" y1="10" x2="18" y2="35" stroke-width="1"/>
      <line x1="70" y1="20" x2="62" y2="52" stroke-width="1.2"/>
      <line x1="110" y1="5" x2="105" y2="28" stroke-width="0.8"/>
      <line x1="130" y1="40" x2="122" y2="75" stroke-width="1"/>
      <line x1="170" y1="15" x2="164" y2="45" stroke-width="1"/>
      <line x1="210" y1="30" x2="202" y2="70" stroke-width="1.4"/>
      <line x1="250" y1="8" x2="245" y2="32" stroke-width="0.8"/>
      <line x1="280" y1="48" x2="274" y2="82" stroke-width="1.1"/>
      <line x1="330" y1="12" x2="322" y2="55" stroke-width="1.3"/>
      <line x1="380" y1="25" x2="372" y2="65" stroke-width="1"/>
      <line x1="415" y1="8" x2="409" y2="38" stroke-width="0.9"/>
      <!-- Droplets -->
      <circle cx="65" cy="56" r="1.5" fill="#ffffff"/>
      <circle cx="204" cy="74" r="1.8" fill="#ffffff"/>
      <circle cx="324" cy="58" r="1.5" fill="#ffffff"/>
      <circle cx="374" cy="68" r="1.4" fill="#ffffff"/>
      <circle cx="123" cy="78" r="1.2" fill="#ffffff"/>
      <circle cx="275" cy="85" r="1.3" fill="#ffffff"/>
    </g>
  </g>

  <!-- Desk Surface Base -->
  <polygon points="12,175 948,175 948,228 12,228" fill="#090d13" stroke="#ffffff" stroke-width="1.2"/>
  <rect x="12" y="176" width="936" height="52" fill="url(#desk-hatch)"/>

  <!-- Desk Lamp & Light Cone Silhouette -->
  <!-- Lamp Base & Neck -->
  <g transform="translate(180, 75)">
    <!-- Base -->
    <ellipse cx="0" cy="100" rx="28" ry="6" fill="#ffffff"/>
    <!-- Stem / Angled Arm -->
    <path d="M 0,98 L 18,50 L 52,18" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="18" cy="50" r="5" fill="#0d1117" stroke="#ffffff" stroke-width="2"/>
    <circle cx="52" cy="18" r="4.5" fill="#0d1117" stroke="#ffffff" stroke-width="2"/>
    <!-- Lamp Shade / Hood -->
    <polygon points="46,12 85,-6 96,26 62,32" fill="#ffffff"/>
    <!-- Light Cone Projection -->
    <polygon points="85,-2 95,26 310,120 70,120" fill="url(#lamp-cone)"/>
    <!-- Screentone hatching inside light pool -->
    <line x1="88" y1="12" x2="160" y2="100" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
    <line x1="94" y1="20" x2="220" y2="100" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
    <line x1="100" y1="26" x2="280" y2="100" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Open Study Notebook & Pen -->
  <g transform="translate(300, 160)">
    <!-- Left & Right Pages -->
    <polygon points="0,15 50,8 100,15 100,28 50,22 0,28" fill="#ffffff"/>
    <polygon points="5,14 48,9 48,21 5,26" fill="#0d1117" opacity="0.1"/>
    <polygon points="52,9 95,14 95,26 52,21" fill="#0d1117" opacity="0.1"/>
    <!-- Text / Circuit ink scribbles -->
    <line x1="10" y1="15" x2="42" y2="13" stroke="#0d1117" stroke-width="0.8"/>
    <line x1="10" y1="18" x2="38" y2="16" stroke="#0d1117" stroke-width="0.8"/>
    <line x1="10" y1="21" x2="44" y2="19" stroke="#0d1117" stroke-width="0.8"/>
    <line x1="56" y1="13" x2="90" y2="15" stroke="#0d1117" stroke-width="0.8"/>
    <line x1="56" y1="16" x2="86" y2="18" stroke="#0d1117" stroke-width="0.8"/>
    <line x1="56" y1="19" x2="88" y2="21" stroke="#0d1117" stroke-width="0.8"/>
    <!-- Fountain Pen -->
    <line x1="106" y1="10" x2="128" y2="24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="106" cy="10" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Stack of Hardcover Engineering Textbooks (VLSI / Signals) -->
  <g transform="translate(68, 135)">
    <!-- Book 3 (Bottom) -->
    <polygon points="0,32 105,32 102,44 -3,44" fill="#161b22" stroke="#ffffff" stroke-width="1.2"/>
    <text x="10" y="41" font-family="'Courier New', monospace" font-size="7" fill="#ffffff">DISCRETE CIRCUITS</text>
    <!-- Book 2 (Middle) -->
    <polygon points="6,20 100,20 98,32 4,32" fill="#0d1117" stroke="#ffffff" stroke-width="1.2"/>
    <text x="14" y="29" font-family="'Courier New', monospace" font-size="7" fill="#ffffff">SIGNALS &amp; SYSTEMS</text>
    <!-- Book 1 (Top) -->
    <polygon points="12,8 96,8 94,20 10,20" fill="#ffffff"/>
    <text x="18" y="17" font-family="'Courier New', monospace" font-size="7" font-weight="900" fill="#0d1117">SEMICONDUCTORS</text>
  </g>

  <!-- Steaming Ceramic Coffee Mug -->
  <g transform="translate(440, 155)">
    <rect x="0" y="4" width="22" height="24" rx="2" fill="#ffffff"/>
    <!-- Handle -->
    <path d="M 22,9 C 30,9 30,22 22,22" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    <!-- Liquid top -->
    <ellipse cx="11" cy="4" rx="11" ry="3" fill="#0d1117"/>
    <!-- Rising Manga Steam Spirals -->
    <path d="M 7,-2 Q 4,-10 9,-18 Q 14,-26 9,-34" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.6"/>
    <path d="M 15,-4 Q 18,-12 13,-20 Q 8,-28 14,-36" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.5"/>
  </g>

  <!-- Laptop / Terminal Silhouette (Subtle screen glow on right) -->
  <g transform="translate(600, 118)">
    <!-- Screen -->
    <polygon points="0,58 35,0 165,0 130,58" fill="#05070a" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="5,55 38,4 160,4 128,55" fill="#0d1117"/>
    <!-- Terminal Lines on Screen -->
    <g fill="#ffffff" opacity="0.7">
      <rect x="42" y="10" width="60" height="2"/>
      <rect x="44" y="16" width="90" height="2"/>
      <rect x="40" y="22" width="75" height="2"/>
      <rect x="36" y="28" width="85" height="2"/>
      <rect x="32" y="34" width="50" height="2"/>
      <rect x="28" y="40" width="95" height="2"/>
      <rect x="24" y="46" width="65" height="2"/>
      <!-- Cursor -->
      <rect x="92" y="46" width="4" height="2"/>
    </g>
    <!-- Keyboard Deck -->
    <polygon points="-15,62 0,58 130,58 145,62" fill="#ffffff"/>
  </g>

  <!-- Manga Dialogue / Monologue Noir Snippet Box -->
  <g transform="translate(775, 140)">
    <polygon points="0,0 155,0 155,54 10,54 0,44" fill="#05070a" stroke="#ffffff" stroke-width="1.2"/>
    <text x="12" y="16" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#ffffff">PHILOSOPHY // 01</text>
    <text x="12" y="28" font-family="'Courier New', monospace" font-size="8" fill="#8b949e">"quiet midnight work</text>
    <text x="12" y="39" font-family="'Courier New', monospace" font-size="8" fill="#8b949e"> compounds silently into</text>
    <text x="12" y="49" font-family="'Courier New', monospace" font-size="8" fill="#8b949e"> relentless precision."</text>
  </g>
</svg>
