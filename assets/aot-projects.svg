<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" height="100%">
  <defs>
    <pattern id="telemetry-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>
    </pattern>
    <pattern id="dots-fine" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.75" fill="#ffffff" opacity="0.2"/>
    </pattern>
    <linearGradient id="scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="250" fill="#0d1117"/>
  <rect width="960" height="250" fill="url(#telemetry-grid)"/>

  <!-- Manga Frame -->
  <rect x="8" y="8" width="944" height="234" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <rect x="12" y="12" width="936" height="226" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>

  <!-- TOP HEADER / RECON BANNER -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="14" height="14" fill="#ffffff"/>
    <text x="22" y="11" font-family="'Courier New', monospace" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="2">02 // FIELD LOGS &amp; RECONNAISSANCE</text>
    <text x="320" y="11" font-family="'Courier New', monospace" font-size="9" fill="#8b949e" letter-spacing="1.5">SURVEY CORPS TELEMETRY PROTOCOL · SENSOR MATRICES</text>
  </g>

  <!-- SURVEY CORPS WINGS OF FREEDOM SHIELD EMBLEM (High Contrast Manga Noir) -->
  <g transform="translate(130, 135)">
    <!-- Outer Shield Contour -->
    <path d="M 0,-70 C 45,-70 55,-50 55,-25 C 55,30 20,65 0,82 C -20,65 -55,30 -55,-25 C -55,-50 -45,-70 0,-70 Z" fill="#05070a" stroke="#ffffff" stroke-width="2"/>
    <!-- Diagonal Shield Partition Line -->
    <path d="M -45,-45 L 45,45" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
    
    <!-- White Feather Wing (Left / Top-Left) -->
    <path d="M -8,-50 C -25,-48 -42,-30 -38,-15 C -30,-15 -20,-22 -15,-20 C -32,-8 -38,10 -30,22 C -22,22 -15,10 -10,12 C -20,28 -22,45 -12,50 C -4,42 -4,28 0,22 Z" fill="#ffffff"/>
    <!-- Blue/Dark Feather Wing (Right / Inverted noir overlap) -->
    <path d="M 4,-45 C 22,-42 40,-25 36,-10 C 26,-10 18,-18 12,-16 C 30,-4 36,14 26,26 C 18,26 12,14 6,16 C 16,32 18,48 8,54 C 2,46 2,32 -2,26 Z" fill="#161b22" stroke="#ffffff" stroke-width="1.2"/>

    <!-- Manga Screentone In Shield Background -->
    <path d="M 0,-65 C 40,-65 48,-48 48,-25 C 48,25 18,58 0,72 C -18,58 -48,25 -48,-25 C -48,-48 -40,-65 0,-65 Z" fill="url(#dots-fine)" opacity="0.3"/>

    <!-- Emblem Label -->
    <rect x="-42" y="88" width="84" height="15" fill="#0d1117" stroke="#ffffff" stroke-width="1"/>
    <text x="0" y="99" font-family="'Courier New', monospace" font-size="7.5" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">SURVEY // EIE</text>
  </g>

  <!-- TELEMETRY SENSOR WAVEFORMS (RoadSOS Accelerometer & GridSenti Fault Waveforms) -->
  <g transform="translate(230, 50)">
    <!-- Waveform Screen Panel -->
    <rect x="0" y="0" width="460" height="165" fill="#05070a" stroke="#ffffff" stroke-width="1.2"/>
    <rect x="0" y="0" width="460" height="165" fill="url(#telemetry-grid)"/>

    <!-- Grid Crosshair Center -->
    <line x1="230" y1="0" x2="230" y2="165" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.25"/>
    <line x1="0" y1="82" x2="460" y2="82" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.25"/>

    <!-- Accelerometer / Gyroscope Waveform (RoadSOS 3-axis simulation) -->
    <!-- Signal 1: White Peak Crash Impulse -->
    <path d="M 10,82 L 50,82 Q 70,80 85,82 L 120,82 L 135,70 L 145,95 L 155,50 L 165,120 L 175,25 L 185,145 L 195,65 L 205,98 L 220,78 L 240,82 L 300,82 L 320,82" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <!-- Signal 2: High Impedance Fault Oscillation (GridSenti) -->
    <path d="M 230,82 Q 250,60 270,82 T 310,82 T 340,70 T 360,110 T 375,45 T 390,125 T 405,60 T 420,95 T 440,82 L 450,82" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="4,2"/>

    <!-- Shaded FFT Energy under peak -->
    <polygon points="155,50 165,120 175,25 185,145 195,65 205,98 220,78 220,82 155,82" fill="#ffffff" opacity="0.15"/>

    <!-- Target Reticle on Critical Fault Point -->
    <g transform="translate(175, 25)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="1"/>
      <circle cx="0" cy="0" r="6" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-dasharray="2,2"/>
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#ffffff" stroke-width="1"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#ffffff" stroke-width="1"/>
      <!-- Target Readout Tag -->
      <rect x="18" y="-14" width="95" height="15" fill="#0d1117" stroke="#ffffff" stroke-width="0.8"/>
      <text x="22" y="-3" font-family="'Courier New', monospace" font-size="7.5" fill="#ffffff">ANOMALY: 8.42g</text>
    </g>

    <!-- Radar Sweep Arc in corner -->
    <path d="M 460,0 A 90 90 0 0 0 370,90" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>
    <line x1="460" y1="0" x2="385" y2="75" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>

    <!-- Telemetry Status Bar inside screen -->
    <rect x="10" y="142" width="440" height="16" fill="#0d1117" stroke="#30363d" stroke-width="0.8"/>
    <text x="16" y="153" font-family="'Courier New', monospace" font-size="8" fill="#8b949e">CH-1: ROADSOS_ACCEL_X // CH-2: GRIDSENTI_HIF_VOLT // STATUS: LOCKED</text>
  </g>

  <!-- RIGHT SIDE: RECON TACTICAL DATA CARD -->
  <g transform="translate(710, 50)">
    <rect x="0" y="0" width="225" height="165" fill="#05070a" stroke="#ffffff" stroke-width="1.2"/>
    <!-- Top badge -->
    <rect x="0" y="0" width="225" height="24" fill="#ffffff"/>
    <text x="12" y="16" font-family="'Courier New', monospace" font-size="9" font-weight="900" fill="#0d1117" letter-spacing="1">EXPEDITION TELEMETRY</text>

    <!-- Data lines -->
    <g font-family="'Courier New', monospace" font-size="8" fill="#ffffff" transform="translate(12, 38)">
      <text x="0" y="0" fill="#8b949e">[PROJECT 01]</text>
      <text x="0" y="11" font-weight="bold">RoadSOS // SENSOR DISPATCH</text>
      <text x="0" y="22" fill="#8b949e">Acc/Gyro Streams · ML Triangulation</text>

      <text x="0" y="42" fill="#8b949e">[PROJECT 02]</text>
      <text x="0" y="53" font-weight="bold">GridSenti // HIF DETECTION</text>
      <text x="0" y="64" fill="#8b949e">High-Impedance Telemetry · Fault ML</text>

      <text x="0" y="84" fill="#8b949e">[PROJECT 03]</text>
      <text x="0" y="95" font-weight="bold">HireLoop // PIPELINE ENGINE</text>
      <text x="0" y="106" fill="#8b949e">Candidate / Placement Lifecycle</text>
    </g>

    <!-- Bottom Hash -->
    <rect x="12" y="152" width="201" height="5" fill="none" stroke="#ffffff" stroke-width="0.5"/>
    <rect x="14" y="153" width="130" height="3" fill="#ffffff"/>
  </g>
</svg>
